  &amp;amp;amp;amp;lt;/defs&amp;amp;amp;amp;gt;

  &amp;amp;amp;amp;lt;rect width=&amp;amp;amp;amp;quot;1600&amp;amp;amp;amp;quot; height=&amp;amp;amp;amp;quot;900&amp;amp;amp;amp;quot; fill=&amp;amp;amp;amp;quot;url(#waterTone)&amp;amp;amp;amp;quot;/&amp;amp;amp;amp;gt;
  &amp;amp;amp;amp;lt;g id=&amp;amp;amp;amp;quot;landforms&amp;amp;amp;amp;quot; aria-label=&amp;amp;amp;amp;quot;由锁定骨架扩展而成的河漫滩洲滩面&amp;amp;amp;amp;quot;&amp;amp;amp;amp;gt;&amp;amp;amp;amp;lt;/g&amp;amp;amp;amp;gt;
&amp;amp;amp;amp;lt;/svg&amp;amp;amp;amp;gt;
&amp;amp;amp;amp;lt;script&amp;amp;amp;amp;gt;
  const svgNS = 'http://www.w3.org/2000/svg';
  const profiles = [
    { half: 11.5, seed: .7, pinch: .66, opacity: .96, segments: [[0, 1]], patches: [[.18, 90, '#b2aa75', .18], [.57, 135, '#405d42', .14], [.83, 72, '#b8a779', .12]] },
    { half: 7.5, seed: 1.9, pinch: .42, opacity: .55, soft: true, segments: [[.02, .89], [.93, .965], [.982, .994]], patches: [[.48, 68, '#b7aa7c', .12]] },
    { half: 13.0, seed: 2.8, pinch: .73, opacity: .98, segments: [[0, 1]], patches: [[.23, 110, '#486344', .18], [.51, 145, '#b6a66e', .14], [.78, 95, '#3d5a40', .13]], holes: [[.68, 18, 3.2]] },
    { half: 9.5, seed: 4.1, pinch: .58, opacity: .78, soft: true, segments: [[.015, .94], [.962, .985]], patches: [[.31, 82, '#aa9c69', .12], [.72, 105, '#466247', .12]] },
    { half: 8.0, seed: 5.4, pinch: .36, opacity: .62, soft: true, segments: [[.04, .49], [.515, .94]], patches: [[.7, 125, '#b0a578', .1]], holes: [[.3, 13, 2.4]] },
    { half: 12.0, seed: 6.7, pinch: .62, opacity: .94, dissolve: true, segments: [[0, .76, 1, 0, 'fade'], [.79, .86, .62, 4, 'eroded'], [.895, .93, .4, -7, 'eroded'], [.958, .974, .22, 9, 'eroded']], patches: [[.17, 120, '#3f5c41', .15], [.44, 92, '#b7aa73', .16], [.71, 95, '#526744', .12]] },
    { half: 10.0, seed: 8.2, pinch: .47, opacity: .7, segments: [[.025, .3], [.318, .57], [.588, .78], [.8, .92], [.945, .972], [.985, .995]], patches: [[.26, 105, '#aa9e70', .12], [.61, 132, '#3f5b40', .11]] }
  ];

  function smoothstep(a, b, value) {
    const x = Math.max(0, Math.min(1, (value - a) / (b - a)));
    return x * x * (3 - 2 * x);
  }

  function edgeNoise(t, seed, side) {
    return 1
      + .075 * Math.sin(t * 11.3 + seed + side)
      + .038 * Math.sin(t * 27.1 + seed * 2.3 + side * 1.7)
      + .016 * Math.sin(t * 53.0 + seed * 4.1);
  }

  function makeLandform(source, profile, start, end, fragmentScale = 1, options = {}) {
    const length = source.getTotalLength();
    const span = end - start;
    const count = Math.max(16, Math.ceil(length * span / 7));
    const left = [];
    const right = [];
    const samples = [];

    for (let i = 0; i &amp;amp;amp;amp;lt;= count; i++) {
      const localT = i / count;
      const t = start + span * localT;
      const distance = t * length;
      const point = source.getPointAtLength(distance);
      const before = source.getPointAtLength(Math.max(0, distance - 1.5));
      const after = source.getPointAtLength(Math.min(length, distance + 1.5));
      const dx = after.x - before.x;
      const dy = after.y - before.y;
      const magnitude = Math.hypot(dx, dy) || 1;
      const nx = -dy / magnitude;
      const ny = dx / magnitude;
      const lateralOffset = options.lateralOffset || 0;
      const center = {
        x: point.x + nx * lateralOffset,
        y: point.y + ny * lateralOffset
      };

      const startFloor = options.noStartTaper ? 1 : (start &amp;amp;amp;amp;gt; .001 ? .38 : .62);
      const endFloors = { fade: .1, fragments: .22, submerge: .72, eroded: .58 };
      const endDurations = { fade: .15, fragments: .11, submerge: .06, eroded: .075 };
      const endFloor = endFloors[options.endMode] ?? .52;
      const endDuration = endDurations[options.endMode] ?? .1;
      const startTaper = startFloor + (1 - startFloor) * smoothstep(0, .095, localT);
      const endTaper = endFloor + (1 - endFloor) * smoothstep(0, endDuration, 1 - localT);
      const pinchDistance = Math.abs(t - profile.pinch);
      const pinch = .58 + .42 * smoothstep(0, .13, pinchDistance);
      const base = profile.half * fragmentScale * startTaper * endTaper * pinch;
      const leftWidth = base * edgeNoise(t, profile.seed, .3);
      const rightWidth = base * edgeNoise(t, profile.seed, 2.1) * .9;

      left.push([center.x + nx * leftWidth, center.y + ny * leftWidth]);
      right.push([center.x - nx * rightWidth, center.y - ny * rightWidth]);
      samples.push({ point: center, nx, ny, tx: dx / magnitude, ty: dy / magnitude, leftWidth, rightWidth });
    }

    function capPoints(sample, direction, seedShift) {
      const average = (sample.leftWidth + sample.rightWidth) / 2;
      const bulge = average * (.42 + .08 * Math.sin(profile.seed + seedShift));
      const tx = sample.tx * direction;
      const ty = sample.ty * direction;
      return [
        [sample.point.x + sample.nx * average * .48 + tx * bulge * .48,
         sample.point.y + sample.ny * average * .48 + ty * bulge * .48],
        [sample.point.x + sample.nx * average * .07 + tx * bulge,
         sample.point.y + sample.ny * average * .07 + ty * bulge],
        [sample.point.x - sample.nx * average * .43 + tx * bulge * .35,
         sample.point.y - sample.ny * average * .43 + ty * bulge * .35]
      ];
    }

    const endCap = capPoints(samples.at(-1), 1, 1.3);
    const startCap = capPoints(samples[0], -1, 3.1).reverse();

    const polygon = document.createElementNS(svgNS, 'polygon');
    polygon.setAttribute('class', 'landform');
    polygon.setAttribute(
      'points',
      left.concat(endCap, right.reverse(), startCap)
        .map(([x, y]) =&amp;amp;amp;amp;gt; `${x.toFixed(2)},${y.toFixed(2)}`).join(' ')
    );
    return polygon;
  }

  function pointAndAngle(source, t) {
    const length = source.getTotalLength();
    const distance = length * t;
    const point = source.getPointAtLength(distance);
    const a = source.getPointAtLength(Math.max(0, distance - 2));
    const b = source.getPointAtLength(Math.min(length, distance + 2));
    return { point, angle: Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI };
  }

  const landforms = document.querySelector('#landforms');
  const endModes = ['fade', 'fragments', 'submerge', 'eroded'];
  profiles.forEach((profile, index) =&amp;amp;amp;amp;gt; {
    const source = document.querySelector(`#trace-${index + 1}`);
    const island = document.createElementNS(svgNS, 'g');
    island.setAttribute('opacity', profile.opacity);
    if (profile.soft) island.setAttribute('filter', 'url(#softLand)');

    const overlays = [];
    const pieces = profile.segments.map((segment, pieceIndex) =&amp;amp;amp;amp;gt; {
      const isFragment = segment[1] - segment[0] &amp;amp;amp;amp;lt; .08;
      const fragmentScale = segment[2] ?? (isFragment ? Math.max(.28, .62 - pieceIndex * .13) : 1);
      const lateralOffset = segment[3] ?? 0;
      const endMode = segment[4] ?? (isFragment ? 'eroded' : endModes[(index * 2 + pieceIndex) % endModes.length]);
      const polygon = makeLandform(source, profile, segment[0], segment[1], fragmentScale, { endMode, lateralOffset });
      island.appendChild(polygon);

      if (endMode === 'fragments' &amp;amp;amp;amp;amp;&amp;amp;amp;amp;amp; !isFragment &amp;amp;amp;amp;amp;&amp;amp;amp;amp;amp; !profile.dissolve) {
        const nextStart = profile.segments[pieceIndex + 1]?.[0] ?? Math.min(1, segment[1] + .045);
        const room = Math.max(0, nextStart - segment[1]);
        const fragmentCount = 1 + ((index + pieceIndex) % 3);
        for (let f = 0; f &amp;amp;amp;amp;lt; fragmentCount; f++) {
          const center = segment[1] + room * (.3 + f * .22);
          const fragmentSpan = Math.min(.009 + f * .002, room * .16);
          if (fragmentSpan &amp;amp;amp;amp;gt; .0015) {
            const remnant = makeLandform(
              source, profile,
              Math.max(segment[1], center - fragmentSpan / 2),
              Math.min(nextStart, center + fragmentSpan / 2),
              .28 - f * .045,
              { endMode: 'eroded' }
            );
            island.appendChild(remnant);
          }
        }
      }

      if (endMode === 'submerge' &amp;amp;amp;amp;amp;&amp;amp;amp;amp;amp; !isFragment) {
        const tailStart = segment[1] - (segment[1] - segment[0]) * .12;
        const overlay = makeLandform(source, profile, tailStart, segment[1], fragmentScale * 1.06, {
          endMode: 'eroded', noStartTaper: true
        });
        const startInfo = pointAndAngle(source, tailStart);
        const endInfo = pointAndAngle(source, segment[1]);
        const gradient = document.createElementNS(svgNS, 'linearGradient');
        const gradientId = `submerge-${index + 1}-${pieceIndex + 1}`;
        gradient.setAttribute('id', gradientId);
        gradient.setAttribute('gradientUnits', 'userSpaceOnUse');
        gradient.setAttribute('x1', startInfo.point.x);
        gradient.setAttribute('y1', startInfo.point.y);
        gradient.setAttribute('x2', endInfo.point.x);
        gradient.setAttribute('y2', endInfo.point.y);
        gradient.innerHTML = '&amp;amp;amp;amp;lt;stop offset=&amp;amp;amp;amp;quot;0&amp;amp;amp;amp;quot; stop-color=&amp;amp;amp;amp;quot;#86a3a9&amp;amp;amp;amp;quot; stop-opacity=&amp;amp;amp;amp;quot;0&amp;amp;amp;amp;quot;/&amp;amp;amp;amp;gt;&amp;amp;amp;amp;lt;stop offset=&amp;amp;amp;amp;quot;.58&amp;amp;amp;amp;quot; stop-color=&amp;amp;amp;amp;quot;#86a3a9&amp;amp;amp;amp;quot; stop-opacity=&amp;amp;amp;amp;quot;.42&amp;amp;amp;amp;quot;/&amp;amp;amp;amp;gt;&amp;amp;amp;amp;lt;stop offset=&amp;amp;amp;amp;quot;1&amp;amp;amp;amp;quot; stop-color=&amp;amp;amp;amp;quot;#86a3a9&amp;amp;amp;amp;quot; stop-opacity=&amp;amp;amp;amp;quot;.9&amp;amp;amp;amp;quot;/&amp;amp;amp;amp;gt;';
        document.querySelector('defs').appendChild(gradient);
        overlay.setAttribute('fill', `url(#${gradientId})`);
        overlay.removeAttribute('class');
        overlays.push(overlay);
      }
      return polygon;
    });

    const clip = document.createElementNS(svgNS, 'clipPath');
    clip.setAttribute('id', `land-clip-${index + 1}`);
    pieces.forEach(piece =&amp;amp;amp;amp;gt; clip.appendChild(piece.cloneNode()));
    document.querySelector('defs').appendChild(clip);

    const details = document.createElementNS(svgNS, 'g');
    details.setAttribute('clip-path', `url(#land-clip-${index + 1})`);
    (profile.patches || []).forEach(([t, length, color, opacity], patchIndex) =&amp;amp;amp;amp;gt; {
      const { point, angle } = pointAndAngle(source, t);
      const patch = document.createElementNS(svgNS, 'ellipse');
      patch.setAttribute('class', 'surface-patch');
      patch.setAttribute('cx', point.x);
      patch.setAttribute('cy', point.y);
      patch.setAttribute('rx', length / 2);
      patch.setAttribute('ry', profile.half * (patchIndex % 2 ? .74 : .52));
      patch.setAttribute('fill', color);
      patch.setAttribute('opacity', opacity);
      patch.setAttribute('filter', 'url(#softPatch)');
      patch.setAttribute('transform', `rotate(${angle} ${point.x} ${point.y})`);
      details.appendChild(patch);
    });

    (profile.holes || []).forEach(([t, rx, ry]) =&amp;amp;amp;amp;gt; {
      const { point, angle } = pointAndAngle(source, t);
      const pool = document.createElementNS(svgNS, 'ellipse');
      pool.setAttribute('cx', point.x);
      pool.setAttribute('cy', point.y);
      pool.setAttribute('rx', rx);
      pool.setAttribute('ry', ry);
      pool.setAttribute('fill', 'url(#waterTone)');
      pool.setAttribute('opacity', '.88');
      pool.setAttribute('transform', `rotate(${angle} ${point.x} ${point.y})`);
      details.appendChild(pool);
    });

    island.appendChild(details);
    overlays.forEach(overlay =&amp;amp;amp;amp;gt; island.appendChild(overlay));
    landforms.appendChild(island);
  });
&amp;amp;amp;amp;lt;/script&amp;amp;amp;amp;gt;
&amp;amp;amp;amp;lt;/body&amp;amp;amp;amp;gt;
&amp;amp;amp;amp;lt;/html&amp;amp;amp;amp;gt;
&amp;amp;amp;quot; title=&amp;amp;amp;quot;Study 06 基底&amp;amp;amp;quot;&amp;amp;amp;gt;&amp;amp;amp;lt;/iframe&amp;amp;amp;gt;
&amp;amp;amp;lt;svg viewBox=&amp;amp;amp;quot;0 0 1600 900&amp;amp;amp;quot; preserveAspectRatio=&amp;amp;amp;quot;xMidYMid slice&amp;amp;amp;quot; aria-label=&amp;amp;amp;quot;七条曲流植物洲实验&amp;amp;amp;quot;&amp;amp;amp;gt;
  &amp;amp;amp;lt;defs&amp;amp;amp;gt;
    &amp;amp;amp;lt;linearGradient id=&amp;amp;amp;quot;water&amp;amp;amp;quot; x1=&amp;amp;amp;quot;0&amp;amp;amp;quot; y1=&amp;amp;amp;quot;0&amp;amp;amp;quot; x2=&amp;amp;amp;quot;0&amp;amp;amp;quot; y2=&amp;amp;amp;quot;900&amp;amp;amp;quot; gradientUnits=&amp;amp;amp;quot;userSpaceOnUse&amp;amp;amp;quot;&amp;amp;amp;gt;
      &amp;amp;amp;lt;stop offset=&amp;amp;amp;quot;0&amp;amp;amp;quot; stop-color=&amp;amp;amp;quot;#9fb9c2&amp;amp;amp;quot;/&amp;amp;amp;gt;&amp;amp;amp;lt;stop offset=&amp;amp;amp;quot;.52&amp;amp;amp;quot; stop-color=&amp;amp;amp;quot;#88a8b2&amp;amp;amp;quot;/&amp;amp;amp;gt;&amp;amp;amp;lt;stop offset=&amp;amp;amp;quot;1&amp;amp;amp;quot; stop-color=&amp;amp;amp;quot;#789aa6&amp;amp;amp;quot;/&amp;amp;amp;gt;
    &amp;amp;amp;lt;/linearGradient&amp;amp;amp;gt;
    &amp;amp;amp;lt;path id=&amp;amp;amp;quot;guide-1&amp;amp;amp;quot; d=&amp;amp;amp;quot;M 780 110 C 960 110 1080 125 1135 155 C 1160 178 1110 200 1030 218 C 860 248 640 250 430 245 C 320 246 245 252 180 258&amp;amp;amp;quot;/&amp;amp;amp;gt;
    &amp;amp;amp;lt;path id=&amp;amp;amp;quot;guide-2&amp;amp;amp;quot; d=&amp;amp;amp;quot;M 109 300 C 216 294 340 288 475 285&amp;amp;amp;quot;/&amp;amp;amp;gt;
    &amp;amp;amp;lt;path id=&amp;amp;amp;quot;guide-3&amp;amp;amp;quot; d=&amp;amp;amp;quot;M 1200 278 C 980 266 750 270 530 320 C 440 337 380 365 350 400 C 320 425 330 450 365 465&amp;amp;amp;quot;/&amp;amp;amp;gt;
    &amp;amp;amp;lt;path id=&amp;amp;amp;quot;guide-4&amp;amp;amp;quot; d=&amp;amp;amp;quot;M 1020 330 C 804 321 599 336 468 373 C 418 387 401 410 414 432 C 435 463 500 465 560 468&amp;amp;amp;quot;/&amp;amp;amp;gt;
    &amp;amp;amp;lt;path id=&amp;amp;amp;quot;guide-5&amp;amp;amp;quot; d=&amp;amp;amp;quot;M 330 525 C 525 508 750 490 950 440 C 1032 420 1092 374 1150 350&amp;amp;amp;quot;/&amp;amp;amp;gt;
    &amp;amp;amp;lt;path id=&amp;amp;amp;quot;guide-6&amp;amp;amp;quot; d=&amp;amp;amp;quot;M 1392 320 C 1417 349 1413 389 1385 420 C 1266 529 1062 562 860 608 C 724 639 627 677 591 718 C 569 743 578 774 607 792&amp;amp;amp;quot;/&amp;amp;amp;gt;
    &amp;amp;amp;lt;path id=&amp;amp;amp;quot;guide-7&amp;amp;amp;quot; d=&amp;amp;amp;quot;M 1024 610 C 885 639 756 678 669 727 C 628 750 613 779 627 807 C 670 885 924 875 1348 855&amp;amp;amp;quot;/&amp;amp;amp;gt;
  &amp;amp;amp;lt;/defs&amp;amp;amp;gt;
  &amp;amp;amp;lt;g id=&amp;amp;amp;quot;covers&amp;amp;amp;quot;&amp;amp;amp;gt;&amp;amp;amp;lt;/g&amp;amp;amp;gt;
  &amp;amp;amp;lt;g id=&amp;amp;amp;quot;vegetation-fields&amp;amp;amp;quot;&amp;amp;amp;gt;&amp;amp;amp;lt;/g&amp;amp;amp;gt;
&amp;amp;amp;lt;/svg&amp;amp;amp;gt;
&amp;amp;amp;lt;script&amp;amp;amp;gt;
  const ns = 'http://www.w3.org/2000/svg';
  const covers = document.querySelector('#covers');
  const fields = document.querySelector('#vegetation-fields');
  const palette = ['#263f32', '#2f4b36', '#39573b', '#45623f', '#526c46', '#60764b', '#748052', '#878357', '#9a8757', '#776b4c'];

  function rngFactory(seed) {
    return () =&amp;amp;amp;gt; {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let value = Math.imul(seed ^ seed &amp;amp;amp;gt;&amp;amp;amp;gt;&amp;amp;amp;gt; 15, 1 | seed);
      value = value + Math.imul(value ^ value &amp;amp;amp;gt;&amp;amp;amp;gt;&amp;amp;amp;gt; 7, 61 | value) ^ value;
      return ((value ^ value &amp;amp;amp;gt;&amp;amp;amp;gt;&amp;amp;amp;gt; 14) &amp;amp;amp;gt;&amp;amp;amp;gt;&amp;amp;amp;gt; 0) / 4294967296;
    };
  }
  const random = rngFactory(1211);

  function frameAt(guide, distance) {
    const length = guide.getTotalLength();
    const d = Math.max(0, Math.min(length, distance));
    const point = guide.getPointAtLength(d);
    const a = guide.getPointAtLength(Math.max(0, d - 2));
    const b = guide.getPointAtLength(Math.min(length, d + 2));
    const dx = b.x - a.x, dy = b.y - a.y;
    const magnitude = Math.hypot(dx, dy) || 1;
    return { point, tx: dx / magnitude, ty: dy / magnitude, nx: -dy / magnitude, ny: dx / magnitude };
  }

  function coverGuide(guide, half) {
    const length = guide.getTotalLength();
    const count = Math.ceil(length / 6);
    const left = [], right = [];
    for (let i = 0; i &amp;amp;amp;lt;= count; i++) {
      const frame = frameAt(guide, length * i / count);
      left.push([frame.point.x + frame.nx * half, frame.point.y + frame.ny * half]);
      right.push([frame.point.x - frame.nx * half, frame.point.y - frame.ny * half]);
    }
    const polygon = document.createElementNS(ns, 'polygon');
    polygon.setAttribute('points', left.concat(right.reverse()).map(([x, y]) =&amp;amp;amp;gt; `${x.toFixed(2)},${y.toFixed(2)}`).join(' '));
    polygon.setAttribute('fill', 'url(#water)');
    covers.appendChild(polygon);
  }

  function makeBlob(frame, across, along, rx, ry, color, opacity, metadata = {}) {
    const cx = frame.point.x + frame.nx * across + frame.tx * along;
    const cy = frame.point.y + frame.ny * across + frame.ty * along;
    const vertices = 7 + Math.floor(random() * 6);
    const points = [];
    for (let i = 0; i &amp;amp;amp;lt; vertices; i++) {
      const angle = i / vertices * Math.PI * 2;
      const lengthVariation = .68 + random() * .55;
      const widthVariation = .66 + random() * .58;
      const x = cx + frame.tx * Math.cos(angle) * rx * lengthVariation + frame.nx * Math.sin(angle) * ry * widthVariation;
      const y = cy + frame.ty * Math.cos(angle) * rx * lengthVariation + frame.ny * Math.sin(angle) * ry * widthVariation;
      points.push(`${x.toFixed(2)},${y.toFixed(2)}`);
    }
    const polygon = document.createElementNS(ns, 'polygon');
    polygon.setAttribute('points', points.join(' '));
    polygon.setAttribute('fill', color);
    polygon.setAttribute('opacity', opacity);
    polygon.dataset.x = cx.toFixed(2);
    polygon.dataset.y = cy.toFixed(2);
    polygon.dataset.baseOpacity = opacity.toFixed(3);
    polygon.dataset.profile = String(metadata.profile ?? -1);
    polygon.dataset.t = Number(metadata.t ?? 0).toFixed(4);
    polygon.dataset.age = Number(metadata.age ?? .5).toFixed(3);
    if (metadata.fragment) polygon.dataset.fragment = 'true';
    const formationPhase = Math.sin(cx * .071 + cy * .053 + (metadata.profile ?? 0) * 1.91);
    const formationSide = formationPhase &amp;amp;amp;gt;= 0 ? 1 : -1;
    const formationDistance = 7 + 27 * Math.abs(Math.sin(cx * .031 + cy * .019 + (metadata.profile ?? 0) * 2.1));
    const formationDrift = 42 * Math.sin(cx * .017 - cy * .023 + (metadata.profile ?? 0) * .83);
    const formationX = frame.nx * formationDistance * formationSide + frame.tx * formationDrift;
    const formationY = frame.ny * formationDistance * formationSide + frame.ty * formationDrift;
    const curl = 5.5 * Math.sin(cx * .043 - cy * .029);
    polygon.dataset.formationX = formationX.toFixed(2);
    polygon.dataset.formationY = formationY.toFixed(2);
    polygon.dataset.formationMidX = (formationX * .48 + frame.nx * curl).toFixed(2);
    polygon.dataset.formationMidY = (formationY * .48 + frame.ny * curl).toFixed(2);
    fields.appendChild(polygon);
  }

  const profiles = [
    { guide: document.querySelector('#guide-1'), cover: 20, corridor: 12, sparse: .68, dense: 3.195, reverse: true, min: 1.7, max: 7.2, seed: -1.2 },
    { guide: document.querySelector('#guide-2'), cover: 14, corridor: 9, uniform: 3.015, min: 1.6, max: 6.6, seed: -.2 },
    { guide: document.querySelector('#guide-3'), cover: 24, corridor: 14, sparse: .782, dense: 3.285, min: 1.7, max: 7.2, seed: .7 },
    { guide: document.querySelector('#guide-4'), cover: 20, corridor: 11, sparse: .828, dense: 3.105, min: 1.6, max: 6.8, seed: 2.4 },
    { guide: document.querySelector('#guide-5'), cover: 18, corridor: 10, sparse: .62, dense: 2.88, min: 1.5, max: 6.4, seed: 4.9 },
    { guide: document.querySelector('#guide-6'), cover: 24, corridor: 13, sparse: .66, dense: 3.195, min: 1.7, max: 7.4, seed: 6.8 },
    { guide: document.querySelector('#guide-7'), cover: 21, corridor: 11, uniform: 1.16, min: 1.6, max: 6.9, seed: 8.6,
      gaps: [[.66, .715], [.835, .878]] }
  ];

  function guideBounds(guide) {
    const length = guide.getTotalLength();
    let minX = Infinity, maxX = -Infinity;
    for (let i = 0; i &amp;amp;amp;lt;= 120; i++) {
      const x = guide.getPointAtLength(length * i / 120).x;
      minX = Math.min(minX, x);
      maxX = Math.max(maxX, x);
    }
    return { minX, maxX };
  }

  function smoothstep(value) {
    const x = Math.max(0, Math.min(1, value));
    return x * x * (3 - 2 * x);
  }

  function densityAt(profile, rightness, t) {
    const directionValue = profile.reverse ? 1 - rightness : rightness;
    const directional = profile.uniform ?? (profile.sparse + (profile.dense - profile.sparse) * smoothstep(directionValue));
    const localVariation = .16 * Math.sin(t * Math.PI * 7.3 + profile.seed)
      + .1 * Math.sin(t * Math.PI * 17.1 + profile.seed * 1.9);
    return Math.max(.55, directional + localVariation);
  }

  profiles.forEach((profile, profileIndex) =&amp;amp;amp;gt; {
    const length = profile.guide.getTotalLength();
    const bounds = guideBounds(profile.guide);
    coverGuide(profile.guide, profile.cover);
    let distance = 2 + random() * 3;
    let guard = 0;

    while (distance &amp;amp;amp;lt; length - 2 &amp;amp;amp;amp;&amp;amp;amp;amp; guard++ &amp;amp;amp;lt; 1800) {
      const t = distance / length;
      const frame = frameAt(profile.guide, distance);
      const rightness = (frame.point.x - bounds.minX) / Math.max(1, bounds.maxX - bounds.minX);
      const densityPosition = profile.reverse ? 1 - rightness : rightness;
      const density = densityAt(profile, rightness, t);
      const gapZone = profile.gaps?.find(([start, end]) =&amp;amp;amp;gt; t &amp;amp;amp;gt;= start &amp;amp;amp;amp;&amp;amp;amp;amp; t &amp;amp;amp;lt;= end);
      if (gapZone &amp;amp;amp;amp;&amp;amp;amp;amp; random() &amp;amp;amp;gt; .16) {
        distance += 4.5 + random() * 7.5;
        continue;
      }
      const gapScale = gapZone ? .5 : 1;
      const centerSize = profile.min + Math.pow(random(), 1.15) * (profile.max - profile.min)
        * Math.min(1.08, .5 + density * .18) * gapScale;
      const acrossCount = gapZone ? 1 : 1
        + (random() &amp;amp;amp;lt; Math.min(.98, density * .42) ? 1 : 0)
        + (random() &amp;amp;amp;lt; Math.min(.88, density * .25) ? 1 : 0)
        + (!profile.uniform &amp;amp;amp;amp;&amp;amp;amp;amp; random() &amp;amp;amp;lt; Math.max(0, (densityPosition - .55) * .9) ? 1 : 0);

      for (let row = 0; row &amp;amp;amp;lt; acrossCount; row++) {
        const widthPulse = .76 + .17 * Math.sin(t * Math.PI * 5.4 + profile.seed)
          + .09 * Math.sin(t * Math.PI * 13.7 + profile.seed * 2.1);
        const spatialWidth = profile.uniform ? .86 : (.72 + .28 * densityPosition);
        const spread = profile.corridor * widthPulse * spatialWidth;
        const gaussianAcross = ((random() + random() + random()) - 1.5) / 1.5;
        const edgeExcursion = random() &amp;amp;amp;lt; .075 ? (random() &amp;amp;amp;lt; .5 ? -1 : 1) * (.82 + random() * .34) : null;
        const across = (edgeExcursion ?? gaussianAcross) * spread;
        const size = centerSize * (.5 + random() * .72);
        const earthTone = random() &amp;amp;amp;lt; .1;
        const colorIndex = earthTone ? 8 + Math.floor(random() * 2) : Math.floor(random() * 8);
        const ageByProfile = [.82,.7,.58,.43,.34,.66,.25];
        makeBlob(
          frame,
          across,
          (random() - .5) * centerSize * 1.3,
          size,
          size * (.3 + random() * .42),
          palette[colorIndex],
          Math.min(.96, .62 + density * .11 + random() * .18),
          {
            profile: profileIndex,
            t,
            age: Math.max(0, Math.min(1, ageByProfile[profileIndex] + .08 * Math.sin(t * Math.PI * 3.1 + profile.seed))),
            fragment: Boolean(gapZone)
          }
        );
      }

      const overlapSpacing = .32 + random() * .46;
      const waterGapChance = profile.uniform ? .045 : (.055 - densityPosition * .035);
      const occasionalWaterGap = random() &amp;amp;amp;lt; waterGapChance ? 1.65 + random() * 1.15 : 1;
      distance += Math.max(1.8, centerSize * 2 * overlapSpacing * occasionalWaterGap / Math.max(.72, density * .76));
    }
  });

  // A few low, detached vegetation remnants below the second landform.
  const secondGuide = document.querySelector('#guide-2');
  const secondLength = secondGuide.getTotalLength();
  const lowerRemnantGroups = [
    { center: .16, spread: .075, count: 6 },
    { center: .49, spread: .1, count: 9 },
    { center: .82, spread: .065, count: 5 }
  ];
  lowerRemnantGroups.forEach(group =&amp;amp;amp;gt; {
    for (let i = 0; i &amp;amp;amp;lt; group.count; i++) {
      const t = group.center + ((random() + random()) / 2 - .5) * group.spread * 2;
      const frame = frameAt(secondGuide, secondLength * t);
      const size = 1.1 + Math.pow(random(), 1.45) * 3.2;
      const earthTone = random() &amp;amp;amp;lt; .14;
      const colorIndex = earthTone ? 8 + Math.floor(random() * 2) : Math.floor(random() * 8);
      makeBlob(
        frame,
        14 + random() * 24,
        (random() - .5) * 12,
        size,
        size * (.28 + random() * .35),
        palette[colorIndex],
        .46 + random() * .28,
        { profile: 1, t, age: .74, fragment: true }
      );
    }
  });

  let formationRun = 0;
  let formationTimers = [];

  function resetFormation(nodes) {
    formationTimers.forEach(clearTimeout);
    formationTimers = [];
    nodes.forEach(node =&amp;amp;amp;gt; {
      node.getAnimations().forEach(animation =&amp;amp;amp;gt; animation.cancel());
      node.style.transform = '';
      node.style.opacity = '';
    });
  }

  function runFormation() {
    const run = ++formationRun;
    const nodes = [...fields.querySelectorAll('polygon[data-profile=&amp;amp;amp;quot;2&amp;amp;amp;quot;], polygon[data-profile=&amp;amp;amp;quot;3&amp;amp;amp;quot;], polygon[data-profile=&amp;amp;amp;quot;4&amp;amp;amp;quot;]')];
    resetFormation(nodes);
    window.top.postMessage({ type: 'ring-v12-formation-status', status: 'running' }, '*');

    nodes.forEach((node, index) =&amp;amp;amp;gt; {
      const baseOpacity = Number(node.dataset.baseOpacity || node.getAttribute('opacity') || .8);
      const dx = Number(node.dataset.formationX || 0);
      const dy = Number(node.dataset.formationY || 0);
      const midX = Number(node.dataset.formationMidX || dx * .48);
      const midY = Number(node.dataset.formationMidY || dy * .48);
      const t = Number(node.dataset.t || 0);
      const profile = Number(node.dataset.profile || 2);
      const dissolve = node.animate([
        { transform: 'translate(0px, 0px)', opacity: baseOpacity },
        { transform: `translate(${dx}px, ${dy}px)`, opacity: .035 }
      ], {
        duration: 720 + (index % 7) * 18,
        easing: 'cubic-bezier(.55,.02,.88,.42)',
        fill: 'forwards'
      });

      const profileDelay = (profile - 2) * 320;
      const riverWaveDelay = (1 - t) * 1180;
      const irregularDelay = 120 * (.5 + .5 * Math.sin(index * 1.73));
      const timer = setTimeout(() =&amp;amp;amp;gt; {
        if (run !== formationRun) return;
        dissolve.cancel();
        const duration = 3900 + 1500 * (.5 + .5 * Math.sin(index * .91 + profile));
        const settle = node.animate([
          { transform: `translate(${dx}px, ${dy}px)`, opacity: .035 },
          { transform: `translate(${dx * .78}px, ${dy * .78}px)`, opacity: Math.min(baseOpacity, .2), offset: .22 },
          { transform: `translate(${midX}px, ${midY}px)`, opacity: baseOpacity * .58, offset: .58 },
          { transform: `translate(${dx * .12}px, ${dy * .12}px)`, opacity: baseOpacity * .84, offset: .84 },
          { transform: 'translate(0px, 0px)', opacity: baseOpacity }
        ], {
          duration,
          easing: 'cubic-bezier(.18,.62,.2,1)',
          fill: 'forwards'
        });
        settle.onfinish = () =&amp;amp;amp;gt; {
          if (run !== formationRun) return;
          settle.cancel();
          node.style.transform = '';
          node.style.opacity = '';
        };
      }, 790 + profileDelay + riverWaveDelay + irregularDelay);
      formationTimers.push(timer);
    });

    formationTimers.push(setTimeout(() =&amp;amp;amp;gt; {
      if (run === formationRun) window.top.postMessage({ type: 'ring-v12-formation-status', status: 'complete' }, '*');
    }, 8200));
  }

  addEventListener('message', event =&amp;amp;amp;gt; {
    if (event.data?.type === 'ring-v12-run-formation') runFormation();
  });

  let accretionRun = 0;
  let accretionLayer = null;
  let accretionAnimations = [];

  function interpolatePath(pathA, pathB, progress) {
    const valuesA = (pathA.match(/-?\d*\.?\d+/g) || []).map(Number);
    const valuesB = (pathB.match(/-?\d*\.?\d+/g) || []).map(Number);
    let index = 0;
    return pathA.replace(/-?\d*\.?\d+/g, () =&amp;amp;amp;gt; {
      const value = valuesA[index] + (valuesB[index] - valuesA[index]) * progress;
      index++;
      return value.toFixed(2);
    });
  }

  function makeProcessPath(d, color, width, opacity, blur = 0) {
    const path = document.createElementNS(ns, 'path');
    path.setAttribute('d', d);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', color);
    path.setAttribute('stroke-width', width);
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('stroke-linejoin', 'round');
    path.setAttribute('opacity', opacity);
    if (blur) path.style.filter = `blur(${blur}px)`;
    return path;
  }

  function resetAccretion(nodes) {
    accretionRun++;
    accretionAnimations.forEach(animation =&amp;amp;amp;gt; animation.cancel());
    accretionAnimations = [];
    accretionLayer?.remove();
    accretionLayer = null;
    nodes.forEach(node =&amp;amp;amp;gt; {
      node.getAnimations().forEach(animation =&amp;amp;amp;gt; animation.cancel());
      node.style.opacity = '';
      node.style.transform = '';
    });
  }

  function runLateralAccretion() {
    const selected = [...fields.querySelectorAll('polygon[data-profile=&amp;amp;amp;quot;2&amp;amp;amp;quot;], polygon[data-profile=&amp;amp;amp;quot;3&amp;amp;amp;quot;]')];
    resetAccretion(selected);
    const run = accretionRun;
    const path3 = document.querySelector('#guide-3').getAttribute('d');
    const path4 = document.querySelector('#guide-4').getAttribute('d');

    accretionLayer = document.createElementNS(ns, 'g');
    accretionLayer.setAttribute('id', 'lateral-accretion-process');
    document.querySelector('svg').appendChild(accretionLayer);

    selected.forEach(node =&amp;amp;amp;gt; {
      const base = Number(node.dataset.baseOpacity || node.getAttribute('opacity') || .8);
      const fade = node.animate([
        { opacity: base },
        { opacity: .025 }
      ], { duration: 650, easing: 'ease-in', fill: 'forwards' });
      accretionAnimations.push(fade);
    });

    const activeChannel = makeProcessPath(path4, '#769da7', 31, .22, 2.2);
    const channelCore = makeProcessPath(path4, '#b9d0d3', 9, .13, 1.1);
    accretionLayer.append(activeChannel, channelCore);

    // Closely overlapping, low-contrast accretion washes.  More intermediate
    // surfaces prevent the migration from reading as several separate rails.
    const sedimentStages = [
      { p:.10, width:11.5, color:'#a6a176', opacity:.10, delay:900 },
      { p:.22, width:13.5, color:'#a19b70', opacity:.12, delay:1450 },
      { p:.35, width:15.5, color:'#99956a', opacity:.14, delay:2000 },
      { p:.48, width:17,   color:'#919064', opacity:.15, delay:2550 },
      { p:.61, width:17.5, color:'#898b60', opacity:.16, delay:3100 },
      { p:.74, width:16,   color:'#81875d', opacity:.15, delay:3650 },
      { p:.86, width:13.5, color:'#79825a', opacity:.13, delay:4200 }
    ];

    sedimentStages.forEach((stage, stageIndex) =&amp;amp;amp;gt; {
      setTimeout(() =&amp;amp;amp;gt; {
        if (run !== accretionRun || !accretionLayer) return;
        const d = interpolatePath(path4, path3, stage.p);
        const ribbon = makeProcessPath(d, stage.color, stage.width, stage.opacity, 1.65);
        accretionLayer.insertBefore(ribbon, activeChannel);
        // A whole accretion surface appears at once and expands across its
        // local normal.  Never draw it from one endpoint to the other: that
        // reads as material travelling along a rail rather than lateral
        // channel migration.
        ribbon.setAttribute('stroke-width', '.25');
        const spread = ribbon.animate([
          { strokeWidth: .25, opacity: .025 },
          { strokeWidth: stage.width * .62, opacity: stage.opacity * .72, offset: .46 },
          { strokeWidth: stage.width, opacity: stage.opacity }
        ], {
          duration: 1650 + stageIndex * 95,
          easing: 'cubic-bezier(.18,.66,.24,1)',
          fill: 'forwards'
        });
        accretionAnimations.push(spread);
      }, stage.delay);
    });

    const start = performance.now();
    function migrate(now) {
      if (run !== accretionRun || !accretionLayer) return;
      const elapsed = now - start;
      const progress = Math.max(0, Math.min(1, elapsed / 5900));
      const eased = progress * progress * (3 - 2 * progress);
      const d = interpolatePath(path4, path3, eased);
      activeChannel.setAttribute('d', d);
      channelCore.setAttribute('d', d);
      activeChannel.setAttribute('opacity', (.22 - eased * .07).toFixed(3));
      if (progress &amp;amp;amp;lt; 1) requestAnimationFrame(migrate);
    }
    requestAnimationFrame(migrate);

    selected.forEach((node, index) =&amp;amp;amp;gt; {
      const base = Number(node.dataset.baseOpacity || node.getAttribute('opacity') || .8);
      const profile = Number(node.dataset.profile || 2);
      const x = Number(node.dataset.x || 0);
      const y = Number(node.dataset.y || 0);
      // Deterministic spatial noise: nearby plants loosely share colonisation
      // moments, but patches across the entire bar appear out of sequence.
      // Crucially this contains no path-position/t term, so there is no
      // right-to-left (or left-to-right) sweep.
      const cellX = Math.floor(x / 46);
      const cellY = Math.floor(y / 34);
      const patchSeed = Math.sin(cellX * 127.1 + cellY * 311.7 + profile * 74.7) * 43758.5453;
      const plantSeed = Math.sin(x * 17.17 + y * 9.23 + index * 1.91) * 24634.6345;
      const patchNoise = patchSeed - Math.floor(patchSeed);
      const plantNoise = plantSeed - Math.floor(plantSeed);
      const patchDelay = patchNoise * 980;
      const withinPatchDelay = plantNoise * 260;
      const eraDelay = profile === 3 ? 2750 : 5700;
      const reveal = node.animate([
        { opacity: .025 },
        { opacity: base * .44, offset: .45 },
        { opacity: base }
      ], {
        delay: eraDelay + patchDelay + withinPatchDelay,
        duration: 1380 + plantNoise * 620,
        easing: 'cubic-bezier(.2,.55,.25,1)',
        fill: 'both'
      });
      accretionAnimations.push(reveal);
    });

    window.top.postMessage({ type: 'ring-v12-accretion-status', status: 'running' }, '*');
    setTimeout(() =&amp;amp;amp;gt; {
      if (run !== accretionRun) return;
      selected.forEach(node =&amp;amp;amp;gt; {
        node.getAnimations().forEach(animation =&amp;amp;amp;gt; animation.cancel());
        node.style.opacity = '';
      });
      const layerFade = accretionLayer?.animate([{ opacity:1 },{ opacity:0 }], {
        duration:900,
        easing:'ease-out',
        fill:'forwards'
      });
      if (layerFade) {
        layerFade.onfinish = () =&amp;amp;amp;gt; {
          if (run !== accretionRun) return;
          accretionLayer?.remove();
          accretionLayer = null;
        };
      }
      window.top.postMessage({ type: 'ring-v12-accretion-status', status: 'complete' }, '*');
    }, 9800);
  }

  addEventListener('message', event =&amp;amp;amp;gt; {
    if (event.data?.type === 'ring-v12-run-accretion') runLateralAccretion();
  });
&amp;amp;amp;lt;/script&amp;amp;amp;gt;

  &amp;amp;lt;defs&amp;amp;gt;
    &amp;amp;lt;linearGradient id=&amp;amp;quot;waterVeil&amp;amp;quot; x1=&amp;amp;quot;0&amp;amp;quot; y1=&amp;amp;quot;0&amp;amp;quot; x2=&amp;amp;quot;1&amp;amp;quot; y2=&amp;amp;quot;1&amp;amp;quot;&amp;amp;gt;
      &amp;amp;lt;stop offset=&amp;amp;quot;0&amp;amp;quot; stop-color=&amp;amp;quot;#dbe9ed&amp;amp;quot; stop-opacity=&amp;amp;quot;.13&amp;amp;quot;/&amp;amp;gt;

    &amp;amp;lt;radialGradient id=&amp;amp;quot;skyReflection&amp;amp;quot; cx=&amp;amp;quot;66%&amp;amp;quot; cy=&amp;amp;quot;43%&amp;amp;quot; rx=&amp;amp;quot;58%&amp;amp;quot; ry=&amp;amp;quot;47%&amp;amp;quot;&amp;amp;gt;

      &amp;amp;lt;stop offset=&amp;amp;quot;.42&amp;amp;quot; stop-color=&amp;amp;quot;#d5e1e2&amp;amp;quot; stop-opacity=&amp;amp;quot;.07&amp;amp;quot;/&amp;amp;gt;
      &amp;amp;lt;stop offset=&amp;amp;quot;1&amp;amp;quot; stop-color=&amp;amp;quot;#b3cbd0&amp;amp;quot; stop-opacity=&amp;amp;quot;0&amp;amp;quot;/&amp;amp;gt;
    &amp;amp;lt;/radialGradient&amp;amp;gt;
    &amp;amp;lt;filter id=&amp;amp;quot;broadBlur&amp;amp;quot; x=&amp;amp;quot;-12%&amp;amp;quot; y=&amp;amp;quot;-60%&amp;amp;quot; width=&amp;amp;quot;124%&amp;amp;quot; height=&amp;amp;quot;220%&amp;amp;quot;&amp;amp;gt;
      &amp;amp;lt;feGaussianBlur stdDeviation=&amp;amp;quot;10&amp;amp;quot;/&amp;amp;gt;
    &amp;amp;lt;/filter&amp;amp;gt;
    &amp;amp;lt;filter id=&amp;amp;quot;rippleBlur&amp;amp;quot; x=&amp;amp;quot;-5%&amp;amp;quot; y=&amp;amp;quot;-80%&amp;amp;quot; width=&amp;amp;quot;110%&amp;amp;quot; height=&amp;amp;quot;260%&amp;amp;quot;&amp;amp;gt;
      &amp;amp;lt;feGaussianBlur stdDeviation=&amp;amp;quot;.65&amp;amp;quot;/&amp;amp;gt;
    &amp;amp;lt;/filter&amp;amp;gt;
    &amp;amp;lt;filter id=&amp;amp;quot;innerWaterBlur&amp;amp;quot; x=&amp;amp;quot;-6%&amp;amp;quot; y=&amp;amp;quot;-90%&amp;amp;quot; width=&amp;amp;quot;112%&amp;amp;quot; height=&amp;amp;quot;280%&amp;amp;quot;&amp;amp;gt;
      &amp;amp;lt;feGaussianBlur stdDeviation=&amp;amp;quot;1.15&amp;amp;quot;/&amp;amp;gt;
    &amp;amp;lt;/filter&amp;amp;gt;
    &amp;amp;lt;linearGradient id=&amp;amp;quot;innerRippleLight&amp;amp;quot; x1=&amp;amp;quot;0&amp;amp;quot; y1=&amp;amp;quot;0&amp;amp;quot; x2=&amp;amp;quot;1&amp;amp;quot; y2=&amp;amp;quot;.25&amp;amp;quot;&amp;amp;gt;
      &amp;amp;lt;stop offset=&amp;amp;quot;0&amp;amp;quot; stop-color=&amp;amp;quot;#e9f0ef&amp;amp;quot; stop-opacity=&amp;amp;quot;0&amp;amp;quot;/&amp;amp;gt;
      &amp;amp;lt;stop offset=&amp;amp;quot;.16&amp;amp;quot; stop-color=&amp;amp;quot;#edf3f2&amp;amp;quot; stop-opacity=&amp;amp;quot;.23&amp;amp;quot;/&amp;amp;gt;
      &amp;amp;lt;stop offset=&amp;amp;quot;.7&amp;amp;quot; stop-color=&amp;amp;quot;#dce8e9&amp;amp;quot; stop-opacity=&amp;amp;quot;.19&amp;amp;quot;/&amp;amp;gt;
      &amp;amp;lt;stop offset=&amp;amp;quot;1&amp;amp;quot; stop-color=&amp;amp;quot;#d7e5e7&amp;amp;quot; stop-opacity=&amp;amp;quot;0&amp;amp;quot;/&amp;amp;gt;
    &amp;amp;lt;/linearGradient&amp;amp;gt;
    &amp;amp;lt;linearGradient id=&amp;amp;quot;innerRippleShade&amp;amp;quot; x1=&amp;amp;quot;0&amp;amp;quot; y1=&amp;amp;quot;0&amp;amp;quot; x2=&amp;amp;quot;1&amp;amp;quot; y2=&amp;amp;quot;.2&amp;amp;quot;&amp;amp;gt;
      &amp;amp;lt;stop offset=&amp;amp;quot;0&amp;amp;quot; stop-color=&amp;amp;quot;#557681&amp;amp;quot; stop-opacity=&amp;amp;quot;0&amp;amp;quot;/&amp;amp;gt;
      &amp;amp;lt;stop offset=&amp;amp;quot;.2&amp;amp;quot; stop-color=&amp;amp;quot;#557681&amp;amp;quot; stop-opacity=&amp;amp;quot;.13&amp;amp;quot;/&amp;amp;gt;
      &amp;amp;lt;stop offset=&amp;amp;quot;.76&amp;amp;quot; stop-color=&amp;amp;quot;#617f88&amp;amp;quot; stop-opacity=&amp;amp;quot;.105&amp;amp;quot;/&amp;amp;gt;
      &amp;amp;lt;stop offset=&amp;amp;quot;1&amp;amp;quot; stop-color=&amp;amp;quot;#617f88&amp;amp;quot; stop-opacity=&amp;amp;quot;0&amp;amp;quot;/&amp;amp;gt;
    &amp;amp;lt;/linearGradient&amp;amp;gt;
  &amp;amp;lt;/defs&amp;amp;gt;

  &amp;amp;lt;rect class=&amp;amp;quot;light-water&amp;amp;quot; width=&amp;amp;quot;1600&amp;amp;quot; height=&amp;amp;quot;900&amp;amp;quot; fill=&amp;amp;quot;url(#waterVeil)&amp;amp;quot;/&amp;amp;gt;

      <h2>河流手记</h2>
      <p>额尔古纳河 · 旅途中所见<span class="archive-date">完成于 2026.08.20</span></p>
    </header>
    <div class="archive-grid">
      <article class="archive-entry">
        <img class="memory-image river-photo" src="../assets/ring_v12/ergun_river_web.jpg?v=2" alt="旅途中拍摄的额尔古纳河、洲体与远山">
        <h3>遇见河流</h3>
        <p>旅途中，我站在额尔古纳河岸，看见水面之间排列着一层层不完整的弧线。它们像年轮，却从不封闭。</p>
      </article>
      <article class="archive-entry">
        <img class="memory-image hand-drawing" src="../assets/ring_v12/hand-drawing_web.jpg?v=2" alt="在电子画板上反复描绘的河道弧线骨架">
        <h3>描摹河迹</h3>
        <p>反复描摹之后，我才意识到：这些并非彼此独立的环，而是河道迁移、沉积与冲刷留下的时间痕迹。</p>
      </article>
      <article class="archive-entry">
        <img class="memory-image process-drawing" src="../assets/ring_v12/excalidraw_process_web.png?v=2" alt="在 Excalidraw 中比较线状洲体、稀疏植物与由密至疏过渡的创作过程">
        <h3>寻找表现方法</h3>
        <p>从纯线条、稀疏植物到由密至疏的碎片排列，我尝试让植物既保留河道轨迹，又不再像一条人工绘制的线。</p>
      </article>
    </div>
    <div class="archive-close" role="button" tabindex="0">回到河面</div>
  </div>

<script>
(() => {
  const artwork = document.querySelector('#artwork');
  const button = document.querySelector('#accretionButton');
  const label = button.querySelector('.button-label');
  const titleBlock = document.querySelector('.title-block');
  const archive = document.querySelector('#riverArchive');
  const archiveClose = document.querySelector('.archive-close');
  let ready = false;

  function setArchive(open) {
    archive.classList.toggle('open',open);
    archive.setAttribute('aria-hidden',String(!open));
    titleBlock.setAttribute('aria-expanded',String(open));
    document.body.classList.toggle('archive-open',open);
  }
  function keyActivate(event,callback) {
    if (event.key==='Enter' || event.key===' ') { event.preventDefault(); event.stopPropagation(); callback(); }
  }
  titleBlock.addEventListener('click',() => setArchive(true));
  titleBlock.addEventListener('keydown',event => keyActivate(event,() => setArchive(true)));
  archiveClose.addEventListener('click',() => setArchive(false));
  archiveClose.addEventListener('keydown',event => keyActivate(event,() => setArchive(false)));
  archive.addEventListener('click',event => { if (event.target===archive) setArchive(false); });

  artwork.addEventListener('load',() => { ready = true; });
  function run() {
    if (!ready || button.disabled) return;
    button.disabled = true;
    label.textContent = '河迹渐生…';
    artwork.contentWindow.postMessage({ type:'ring-v12-run-accretion' },'*');
  }
  button.addEventListener('click',run);
  addEventListener('keydown',event => {
    if (event.key==='Escape' && archive.classList.contains('open')) { setArchive(false); return; }
    if (archive.classList.contains('open')) return;
    if ((event.key==='Enter' || event.key===' ') && !button.disabled) {
      event.preventDefault();
      run();
    }
  });
  addEventListener('message',event => {
    if (event.data?.type!=='ring-v12-accretion-status') return;
    if (event.data.status==='running') {
      button.disabled = true;
      label.textContent = '河迹渐生…';
    } else if (event.data.status==='complete') {
      button.disabled = false;
      label.textContent = '再循河迹';
    }
  });
})();
</script>
