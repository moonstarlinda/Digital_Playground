<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#080b0d">
<meta name="description" content="Ring V11 · Between Shots — 一颗乒乓球穿过四次时代曝光，传承仍在继续。">
<title>Ring V11 · Between Shots</title>
<style>
    :root {
        color-scheme: dark;
        --paper: #f1ede2;
        --muted: rgba(230, 227, 216, 0.38);
    }

    * { box-sizing: border-box; }

    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #090c0a;
        color: var(--paper);
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
    }

    .title-block {
        position: fixed;
        z-index: 4;
        left: 26px;
        bottom: 24px;
        pointer-events: none;
        animation: title-fade 8s ease forwards;
    }

    h1 {
        margin: 0 0 8px;
        font-size: 12px;
        font-weight: 450;
        letter-spacing: 0.18em;
        text-transform: uppercase;
    }

    .caption {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.06em;
    }

    .controls {
        position: fixed;
        z-index: 5;
        right: 20px;
        bottom: 18px;
        display: flex;
        gap: 7px;
        opacity: 0.26;
        transition: opacity 300ms ease;
    }

    .controls:hover,
    .controls:focus-within {
        opacity: 1;
    }

    button,
    .back {
        display: inline-grid;
        min-height: 34px;
        padding: 0 13px;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        background: rgba(7, 10, 8, 0.5);
        color: rgba(244, 241, 230, 0.58);
        font: inherit;
        font-size: 9px;
        letter-spacing: 0.1em;
        text-decoration: none;
        text-transform: uppercase;
        backdrop-filter: blur(10px);
        cursor: pointer;
    }

    button:hover,
    button:focus-visible,
    .back:hover,
    .back:focus-visible {
        border-color: rgba(239, 196, 108, 0.42);
        color: #fff8e6;
        outline: none;
    }

    @keyframes title-fade {
        0%, 48% { opacity: 1; transform: translateY(0); }
        75%, 100% { opacity: 0; transform: translateY(5px); }
    }

    @media (max-width: 620px) {
        .title-block { left: 16px; bottom: 65px; }
        .caption { max-width: calc(100vw - 32px); }
        .controls { right: 12px; bottom: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
        .caption { transition: none; }
    }
</style>
</head>

<body>
<canvas id="stage" aria-label="一颗乒乓球的连续运动被依次冻结为四个画面"></canvas>

<div class="title-block">
    <h1>Ring V11 · Between Shots</h1>
    <p class="caption">三个辉煌时代，一个仍待回答的未来。</p>
</div>

<div class="controls">
    <a class="back" href="./ring_of_ideas_index.html">Index</a>
    <button id="pauseButton" type="button">Pause</button>
    <button id="replayButton" type="button">Replay</button>
</div>

<script>
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const pauseButton = document.getElementById("pauseButton");
const replayButton = document.getElementById("replayButton");
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const FRAME_DURATION = 2.15;
const FINAL_HOLD = 6.5;
const FRAME_TOTAL = 4;
const MOTION_DURATION = FRAME_DURATION * FRAME_TOTAL;
const DURATION = MOTION_DURATION + FINAL_HOLD;
const TAU = Math.PI * 2;
const FROZEN_MOMENTS = [0.12, 0.41, 0.61, 0.87];
const ERAS = [
    {
        title: "双子星",
        years: "1990s",
        names: "刘国梁 · 孔令辉",
        color: [216, 174, 99]
    },
    {
        title: "二王一马",
        years: "2000s",
        names: "王励勤 · 马琳 · 王皓",
        color: [215, 113, 76]
    },
    {
        title: "三剑客",
        years: "2010s",
        names: "马龙 · 张继科 · 许昕",
        color: [214, 227, 235]
    },
    {
        title: "新一代",
        years: "2020s",
        names: "仍待回答",
        color: [165, 138, 219],
        unresolved: true
    }
];

let width = 0;
let height = 0;
let dpr = 1;
let startTime = performance.now();
let pausedAt = 0;
let currentTime = 0;
let paused = false;
let animationId;
let filmGrain = [];

const clamp = (value, min = 0, max = 1) => Math.max(min, Math.min(max, value));
const mix = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
const easeInOut = t => {
    const v = clamp(t);
    return v * v * (3 - 2 * v);
};

function resize() {
    cancelAnimationFrame(animationId);
    width = window.innerWidth;
    height = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    canvas.style.width = `${width}px`;
    canvas.style.height = `${height}px`;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const grainCount = Math.min(1200, Math.max(420, Math.floor((width * height) / 1900)));
    filmGrain = Array.from({ length: grainCount }, () => ({
        x: Math.random(),
        y: Math.random(),
        size: 0.35 + Math.random() * 0.75,
        alpha: 0.006 + Math.random() * 0.014,
        phase: Math.random() * TAU,
        light: Math.random() > 0.38
    }));
    draw(performance.now());
}

function layout() {
    const marginX = width < 620 ? 18 : 42;
    const top = height * 0.16;
    const bottom = height * 0.82;
    return {
        left: marginX,
        right: width - marginX,
        top,
        bottom,
        tableY: mix(top, bottom, 0.72),
        netX: width * 0.5,
        panelWidth: (width - marginX * 2) / 4
    };
}

// One continuous side-view trajectory. Frame boundaries cut time only.
// The two contact points preserve the direction of travel and only change vertical velocity.
function trajectory(u) {
    const l = layout();
    const firstBounce = 0.265;
    const secondBounce = 0.735;
    const flightRange = l.tableY - l.top;
    // Racket contacts sit only modestly above the table, close to practical playing height.
    const startY = l.tableY - flightRange * 0.22;
    const endY = l.tableY - flightRange * 0.16;
    // The main flight clears the net decisively without becoming a theatrical, oversized lob.
    const mainArcHeight = flightRange * 0.39;
    const startX = l.left + l.panelWidth * 0.18;
    const firstBounceX = mix(l.left, l.right, 0.235);
    const secondBounceX = mix(l.left, l.right, 0.735);
    const exitX = l.right + l.panelWidth * 0.34;
    let x;
    let y;

    if (u <= firstBounce) {
        const t = u / firstBounce;
        // Air drag gently reduces horizontal speed before the first contact.
        const distanceT = 1 - Math.pow(1 - t, 1.08);
        x = mix(startX, firstBounceX, distanceT);
        y = mix(startY, l.tableY, t * t);
    } else if (u <= secondBounce) {
        const t = (u - firstBounce) / (secondBounce - firstBounce);
        const distanceT = 1 - Math.pow(1 - t, 1.1);
        x = mix(firstBounceX, secondBounceX, distanceT);
        // Topspin keeps the flight compact and makes the descending half slightly steeper.
        const shapedT = t < 0.5
            ? Math.pow(t * 2, 0.92) / 2
            : 1 - Math.pow((1 - t) * 2, 1.12) / 2;
        y = l.tableY - Math.sin(shapedT * Math.PI) * mainArcHeight;
    } else {
        const t = (u - secondBounce) / (1 - secondBounce);
        // Friction converts part of the topspin into forward speed after the table contact.
        const distanceT = 1 - Math.pow(1 - t, 1.2);
        x = mix(secondBounceX, exitX, distanceT);
        y = mix(l.tableY, endY, easeOut(t));
    }

    return { x, y };
}

function progressAtX(targetX) {
    let low = 0;
    let high = 1;
    for (let iteration = 0; iteration < 16; iteration++) {
        const middle = (low + high) / 2;
        if (trajectory(middle).x < targetX) low = middle;
        else high = middle;
    }
    return (low + high) / 2;
}

function drawBackground(activeFrame, localProgress, allComplete) {
    const l = layout();
    const background = ctx.createLinearGradient(0, 0, 0, height);
    background.addColorStop(0, "#111510");
    background.addColorStop(0.55, "#0b0f0c");
    background.addColorStop(1, "#070907");
    ctx.fillStyle = background;
    ctx.fillRect(0, 0, width, height);

    for (let index = 0; index < 4; index++) {
        const x = l.left + index * l.panelWidth;
        const completed = index < activeFrame || allComplete;
        const active = index === activeFrame && !allComplete;
        let alpha = completed ? 0.055 : 0.018;
        if (active) alpha = mix(0.025, 0.085, easeInOut(localProgress));

        const panelGlow = ctx.createRadialGradient(
            x + l.panelWidth / 2,
            height * 0.46,
            0,
            x + l.panelWidth / 2,
            height * 0.46,
            l.panelWidth * 0.78
        );
        panelGlow.addColorStop(0, `rgba(128, 135, 112, ${alpha * 0.62})`);
        panelGlow.addColorStop(1, "rgba(128, 135, 112, 0)");
        ctx.fillStyle = panelGlow;
        ctx.fillRect(x, l.top, l.panelWidth, l.bottom - l.top);
    }

    // Stable, near-imperceptible grain: texture rather than visible noise.
    ctx.save();
    filmGrain.forEach(grain => {
        const breathe = 0.82 + Math.sin(currentTime * 0.16 + grain.phase) * 0.18;
        ctx.fillStyle = grain.light
            ? `rgba(231,226,207,${grain.alpha * breathe})`
            : `rgba(0,0,0,${grain.alpha * 0.72 * breathe})`;
        ctx.fillRect(grain.x * width, grain.y * height, grain.size, grain.size);
    });
    ctx.restore();
}

function drawTable(netPulse = 0) {
    const l = layout();
    const line = ctx.createLinearGradient(l.left, 0, l.right, 0);
    line.addColorStop(0, "rgba(210,207,190,0.04)");
    line.addColorStop(0.12, "rgba(210,207,190,0.2)");
    line.addColorStop(0.88, "rgba(210,207,190,0.2)");
    line.addColorStop(1, "rgba(210,207,190,0.04)");

    ctx.strokeStyle = line;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(l.left, l.tableY);
    ctx.lineTo(l.right, l.tableY);
    ctx.stroke();

    // ITTF dimensions: 2.74 m table length and 15.25 cm net height.
    const netHeight = (l.right - l.left) * (0.1525 / 2.74);
    ctx.strokeStyle = `rgba(215,211,194,${0.24 + netPulse * 0.2})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(l.netX, l.tableY);
    ctx.lineTo(l.netX, l.tableY - netHeight);
    ctx.stroke();

    ctx.strokeStyle = "rgba(215,211,194,0.07)";
    ctx.setLineDash([2, 5]);
    for (let y = l.tableY - netHeight; y < l.tableY; y += 7) {
        ctx.beginPath();
        ctx.moveTo(l.netX - 5, y);
        ctx.lineTo(l.netX + 5, y);
        ctx.stroke();
    }
    ctx.setLineDash([]);

    if (netPulse > 0) {
        const shimmer = ctx.createLinearGradient(l.netX, l.tableY - netHeight, l.netX, l.tableY);
        shimmer.addColorStop(0, "rgba(239,229,199,0)");
        shimmer.addColorStop(0.55, `rgba(239,229,199,${0.16 * netPulse})`);
        shimmer.addColorStop(1, "rgba(239,229,199,0)");
        ctx.strokeStyle = shimmer;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(l.netX, l.tableY - netHeight);
        ctx.lineTo(l.netX, l.tableY);
        ctx.stroke();
    }
}

function drawPath(fromU, toU, alpha, widthValue = 1.5) {
    if (toU <= fromU) return;
    const samples = Math.max(18, Math.ceil((toU - fromU) * 520));
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i <= samples; i++) {
        const u = mix(fromU, toU, i / samples);
        const point = trajectory(u);
        const futureT = clamp((u - FROZEN_MOMENTS[3]) / (1 - FROZEN_MOMENTS[3]));
        const scatterSeed = 0.5 + Math.sin(i * 19.731) * 0.5;
        if (futureT > 0 && scatterSeed < futureT * 0.48) continue;
        const driftX = Math.cos(i * 7.137 + currentTime * 0.28) * futureT * 2.2;
        const driftY = Math.sin(i * 11.913 + currentTime * 0.34) * futureT * 4.2;
        const age = 1 - i / samples;
        const persistence = 0.16 + Math.pow(1 - age, 0.62) * 0.84;
        const grain = 0.72 + Math.sin(i * 12.9898) * 0.16;
        const size = (0.34 + (i % 7 === 0 ? 0.34 : 0)) * widthValue;
        const futureFade = 1 - futureT * 0.72;
        ctx.fillStyle = `rgba(238,225,191,${alpha * persistence * grain * 0.52 * futureFade})`;
        ctx.beginPath();
        ctx.arc(point.x + driftX, point.y + driftY, size * (1 - futureT * 0.18), 0, TAU);
        ctx.fill();
    }
    ctx.restore();
}

function drawBall(u, alpha, frozen = false, tone = [249, 246, 233]) {
    const point = trajectory(u);
    const radius = Math.max(5.5, Math.min(width, height) * 0.008);
    const rotation = u * TAU * 7.5;
    const [red, green, blue] = tone;

    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const glow = ctx.createRadialGradient(point.x, point.y, 0, point.x, point.y, radius * 4.2);
    glow.addColorStop(0, `rgba(${red}, ${green}, ${blue}, ${0.82 * alpha})`);
    glow.addColorStop(0.22, `rgba(${red}, ${green}, ${blue}, ${0.27 * alpha})`);
    glow.addColorStop(1, `rgba(${red}, ${green}, ${blue}, 0)`);
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(point.x, point.y, radius * 4.2, 0, TAU);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = `rgba(${red}, ${green}, ${blue}, ${alpha})`;
    ctx.beginPath();
    ctx.arc(point.x, point.y, radius, 0, TAU);
    ctx.fill();

    ctx.strokeStyle = `rgba(${Math.max(0, red - 62)}, ${Math.max(0, green - 62)}, ${Math.max(0, blue - 62)}, ${0.54 * alpha})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(point.x, point.y, radius * 0.64, radius * 0.27, rotation, 0, TAU);
    ctx.stroke();

    if (frozen) {
        ctx.strokeStyle = `rgba(${red}, ${green}, ${blue}, ${0.16 * alpha})`;
        ctx.beginPath();
        ctx.arc(point.x, point.y, radius * 1.65, 0, TAU);
        ctx.stroke();
    }
}

function eraTone(era, time) {
    if (!era.unresolved) return era.color;
    const shift = 0.5 + Math.sin(time * 2.2) * 0.5;
    return era.color.map((channel, index) => Math.round(mix(channel, [197, 201, 232][index], shift * 0.56)));
}

function drawEraExposure(index, moment, reveal, time) {
    const era = ERAS[index];
    const point = trajectory(moment);
    const l = layout();
    const ballRadius = Math.max(5.5, Math.min(width, height) * 0.008);
    const pulse = era.unresolved ? 0.68 + Math.sin(time * 2.2) * 0.28 : 1;
    const alpha = reveal * pulse;
    const [red, green, blue] = eraTone(era, time);

    ctx.save();
    ctx.translate(point.x, point.y);
    ctx.lineCap = "round";

    if (era.unresolved) {
        // The current generation never resolves into a fully closed exposure.
        ctx.setLineDash([1.5, 5]);
        ctx.strokeStyle = `rgba(${red}, ${green}, ${blue}, ${0.24 * alpha})`;
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.arc(0, 0, ballRadius * 2.45, -Math.PI * 0.12, Math.PI * 1.28);
        ctx.stroke();
        ctx.setLineDash([]);
    } else {
        const bloom = ctx.createRadialGradient(0, 0, 0, 0, 0, ballRadius * 6.5);
        bloom.addColorStop(0, `rgba(${red}, ${green}, ${blue}, ${0.2 * alpha})`);
        bloom.addColorStop(0.28, `rgba(${red}, ${green}, ${blue}, ${0.09 * alpha})`);
        bloom.addColorStop(1, `rgba(${red}, ${green}, ${blue}, 0)`);
        ctx.fillStyle = bloom;
        ctx.beginPath();
        ctx.arc(0, 0, ballRadius * 6.5, 0, TAU);
        ctx.fill();

        // Slightly displaced photographic ghosts, not a diagram of headcount.
        const strength = index === 2 ? 0.2 : index === 1 ? 0.15 : 0.12;
        [-1, 1].forEach(direction => {
            ctx.strokeStyle = `rgba(${red}, ${green}, ${blue}, ${strength * alpha})`;
            ctx.lineWidth = index === 2 ? 1 : 0.75;
            ctx.beginPath();
            ctx.arc(
                direction * (1.4 + index * 0.35),
                direction * -0.6,
                ballRadius * (1.55 + index * 0.08),
                0,
                TAU
            );
            ctx.stroke();
        });

        const glint = 0.5 + Math.sin(time * 0.9 + index * 1.7) * 0.5;
        ctx.strokeStyle = `rgba(${red}, ${green}, ${blue}, ${0.2 * alpha * glint})`;
        ctx.lineWidth = 0.7;
        ctx.beginPath();
        ctx.moveTo(-ballRadius * 3.2, 0);
        ctx.lineTo(ballRadius * 3.2, 0);
        ctx.moveTo(0, -ballRadius * 3.2);
        ctx.lineTo(0, ballRadius * 3.2);
        ctx.stroke();
    }
    ctx.restore();

    const textReveal = easeInOut(clamp((reveal - 0.22) / 0.78));
    const labelY = l.top + 42;

    const labelGlow = ctx.createRadialGradient(
        point.x,
        labelY + 18,
        0,
        point.x,
        labelY + 18,
        Math.min(105, l.panelWidth * 0.42)
    );
    labelGlow.addColorStop(0, `rgba(${red}, ${green}, ${blue}, ${0.055 * textReveal * pulse})`);
    labelGlow.addColorStop(0.42, `rgba(${red}, ${green}, ${blue}, ${0.022 * textReveal * pulse})`);
    labelGlow.addColorStop(1, `rgba(${red}, ${green}, ${blue}, 0)`);
    ctx.fillStyle = labelGlow;
    ctx.fillRect(
        point.x - Math.min(105, l.panelWidth * 0.42),
        labelY - 55,
        Math.min(210, l.panelWidth * 0.84),
        145
    );

    ctx.save();
    ctx.textAlign = "center";
    ctx.fillStyle = `rgba(${red}, ${green}, ${blue}, ${0.9 * textReveal * pulse})`;
    ctx.font = '500 24px Inter, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillText(era.title, point.x, labelY);

    ctx.fillStyle = `rgba(${red}, ${green}, ${blue}, ${0.62 * textReveal * pulse})`;
    ctx.font = '14px ui-monospace, "SFMono-Regular", Menlo, monospace';
    ctx.fillText(era.years, point.x, labelY + 22);

    ctx.fillStyle = `rgba(${red}, ${green}, ${blue}, ${0.64 * textReveal * pulse})`;
    ctx.font = '14px Inter, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillText(era.names, point.x, labelY + 43);
    ctx.restore();
}

function drawContactRipple(u, reveal) {
    const point = trajectory(u);
    const fade = 1 - reveal;

    const flash = ctx.createRadialGradient(point.x, point.y, 0, point.x, point.y, 18);
    flash.addColorStop(0, `rgba(255, 239, 196, ${0.38 * fade})`);
    flash.addColorStop(0.22, `rgba(239, 198, 112, ${0.16 * fade})`);
    flash.addColorStop(1, "rgba(239, 198, 112, 0)");
    ctx.fillStyle = flash;
    ctx.beginPath();
    ctx.arc(point.x, point.y, 18, 0, TAU);
    ctx.fill();

    ctx.strokeStyle = `rgba(239, 198, 112, ${fade * 0.42})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(point.x, point.y + 1, 4 + reveal * 24, 1.5 + reveal * 8, 0, 0, TAU);
    ctx.stroke();
}

function draw(now) {
    const time = paused ? pausedAt : ((now - startTime) / 1000) % DURATION;
    currentTime = time;

    const allComplete = time >= MOTION_DURATION;
    // A single uninterrupted clock drives the live ball from start to finish.
    const motionProgress = allComplete ? 1 : clamp(time / MOTION_DURATION);
    const activeFrame = Math.min(3, Math.floor(motionProgress * FRAME_TOTAL));
    const localProgress = allComplete
        ? 1
        : motionProgress * FRAME_TOTAL - activeFrame;
    const netU = progressAtX(layout().netX);
    const netPulse = clamp(1 - Math.abs(motionProgress - netU) / 0.028);

    drawBackground(activeFrame, localProgress, allComplete);
    drawTable(easeInOut(netPulse));

    // The trajectory grows continuously; it is never restarted at a frame boundary.
    drawPath(0, motionProgress, allComplete ? 0.48 : 0.78, allComplete ? 1.3 : 1.65);

    // Crossing a chosen moment leaves an exposure behind while the live ball keeps moving.
    FROZEN_MOMENTS.forEach((moment, index) => {
        if (motionProgress < moment) return;
        const reveal = clamp((motionProgress - moment) / 0.018);
        const nodePulse = ERAS[index].unresolved ? 0.68 + Math.sin(time * 2.2) * 0.28 : 1;
        drawBall(moment, 0.62 * reveal * nodePulse, true, eraTone(ERAS[index], time));
        const eraReveal = clamp((motionProgress - moment) / 0.055);
        drawEraExposure(index, moment, eraReveal, time);
    });

    drawBall(motionProgress, allComplete ? 0.88 : 1);

    // Contact with the table occurs once before and once after the net.
    const visibleU = motionProgress;
    [0.265, 0.735].forEach(contactU => {
        const distance = visibleU - contactU;
        if (distance >= 0 && distance < 0.06) {
            drawContactRipple(contactU, distance / 0.06);
        }
    });

    if (!paused && !reduceMotion) animationId = requestAnimationFrame(draw);
}

function replay() {
    paused = false;
    pausedAt = 0;
    currentTime = 0;
    startTime = performance.now();
    pauseButton.textContent = "Pause";
    cancelAnimationFrame(animationId);
    draw(performance.now());
}

function togglePause() {
    if (paused) {
        paused = false;
        startTime = performance.now() - pausedAt * 1000;
        pauseButton.textContent = "Pause";
        draw(performance.now());
    } else {
        pausedAt = currentTime;
        paused = true;
        pauseButton.textContent = "Continue";
        cancelAnimationFrame(animationId);
        draw(performance.now());
    }
}

pauseButton.addEventListener("click", togglePause);
replayButton.addEventListener("click", replay);
window.addEventListener("resize", resize, { passive: true });
window.addEventListener("keydown", event => {
    if (event.code === "Space") {
        event.preventDefault();
        togglePause();
    }
    if (event.key.toLowerCase() === "r") replay();
});
document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
        cancelAnimationFrame(animationId);
    } else if (!paused) {
        startTime = performance.now() - currentTime * 1000;
        draw(performance.now());
    }
});

if (reduceMotion) {
    paused = true;
    pausedAt = MOTION_DURATION;
}

resize();
</script>
</body>
</html>
